# GmSSL minimal configuration for SM3 support only
CONFIG_GMSSL=y

# Disable problematic modules
CONFIG_GMSSL_SDF=n
CONFIG_GMSSL_TLS=n

# Keep only essential cryptographic functions
# SM3 is included by default when GMSSL is enabled

# Disable additional algorithms to reduce footprint
CONFIG_GMSSL_SHA1=n
CONFIG_GMSSL_SHA2=n
CONFIG_GMSSL_AES=n
CONFIG_GMSSL_CHACHA20=n

# Disable SM4 modes to reduce footprint
CONFIG_GMSSL_SM4_ECB=n
CONFIG_GMSSL_SM4_OFB=n
CONFIG_GMSSL_SM4_CFB=n
CONFIG_GMSSL_SM4_CCM=n
CONFIG_GMSSL_SM4_XTS=n
CONFIG_GMSSL_SM4_CBC_MAC=n

# Disable extensions
CONFIG_GMSSL_SM2_EXTS=n
CONFIG_GMSSL_SM3_XMSS=n
