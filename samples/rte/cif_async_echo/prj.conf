# Generic networking options
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y

# shell options
CONFIG_SHELL=y

# Gneric kernel options
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=26214400
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=26214400

# Logging
CONFIG_NET_LOG=y
CONFIG_LOG=y
CONFIG_ASSERT=n
CONFIG_NET_STATISTICS=y
CONFIG_PRINTK=y
CONFIG_LOG_SPEED=n
CONFIG_LOG_BUFFER_SIZE=65536
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=50
CONFIG_LOG_BLOCK_IN_THREAD=y
CONFIG_LOG_CMDS=y
CONFIG_MCB_LOG_LEVEL_WRN=y

# CIF specific options
CONFIG_NET_SOCKETS_CIF=y
CONFIG_STD_CPP20=y

# CIF performance options
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000000
CONFIG_LDP_MAX_HARQ=32

# Enable trace
CONFIG_USE_SEGGER_RTT=y
CONFIG_TRACING=y
CONFIG_SEGGER_SYSTEMVIEW=y
CONFIG_TRACING_BUFFER_SIZE=65536
CONFIG_SEGGER_SYSVIEW_RTT_BUFFER_SIZE=65536
