# Application configuration
CONFIG_APP_LITTLEFS_STORAGE_BLK_SDMMC=y

# SDMMC configuration
CONFIG_GPIO=y
CONFIG_SDHC=y
CONFIG_SDMMC_STACK=y

# Disk driver configuration
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_DISK_DRIVER_MMC=y

# Littlefs configuration
CONFIG_FS_LITTLEFS_BLK_DEV=y
CONFIG_FS_LITTLEFS_CACHE_SIZE=512

CONFIG_ARM_MMU_NUM_L2_TABLES=1024

# FATFS
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FAT_FILESYSTEM_ELM=y

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=8192
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=8192
CONFIG_ETH_FMQL=y
CONFIG_MDIO=y
CONFIG_SERIAL_INIT_PRIORITY=50
CONFIG_ETH_INIT_PRIORITY=95
# CONFIG_NO_OPTIMIZATIONS=y
CONFIG_NOCACHE_MEMORY=y

CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_NET_ICMPV4_ACCEPT_BROADCAST=y
CONFIG_NET_SOCKETS_SERVICE=y
CONFIG_NET_SOCKETS_SERVICE_THREAD_PRIO=10
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=y
CONFIG_NET_SOCKETS_POLL_MAX=128

CONFIG_NET_PKT_RX_COUNT=256
CONFIG_NET_PKT_TX_COUNT=256
CONFIG_NET_BUF_RX_COUNT=800
CONFIG_NET_BUF_TX_COUNT=800

CONFIG_NET_ZPERF=y


CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=65535
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=65535

CONFIG_NET_BUF_DATA_SIZE=1536

# eMMC driver
CONFIG_SDHC=y
CONFIG_MMC_STACK=y

# littlefs for eMMC
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_MMC=y
CONFIG_FS_LITTLEFS_BLK_DEV=y
CONFIG_FS_LITTLEFS_HEAP_PER_ALLOC_OVERHEAD_SIZE=128

# app for eMMC
CONFIG_APP_LITTLEFS_STORAGE_BLK_SDMMC=y
