# shell options
CONFIG_SHELL=y

# SSL options
CONFIG_WOLFSSL=y
CONFIG_POSIX_THREADS=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_WOLFSSL_SETTINGS_FILE="inc/wolfssl_settings.h"

# Gneric kernel options
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=26214400
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=26214400

# Logging
CONFIG_LOG=y
CONFIG_PRINTK=y
