CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SPI_DW_DMA=y

# Enable DMA support
CONFIG_DMA=y
CONFIG_DMA_64BIT=n

# set spi log level
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
# CONFIG_SPI_LOG_LEVEL_DBG=y
# CONFIG_DMA_LOG_LEVEL_DBG=y

# close build optimization
# CONFIG_NO_OPTIMIZATIONS=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
