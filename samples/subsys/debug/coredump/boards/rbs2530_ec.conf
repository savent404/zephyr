# Board-specific configuration for RBS2530_EC
# This file contains board-specific optimizations and hardware configurations

# ==============================================================================
# Board-Specific Kernel Configuration
# ==============================================================================
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=2
CONFIG_NUM_PREEMPT_PRIORITIES=16

# ==============================================================================
# Ethernet Driver Configuration (Board-Specific)
# ==============================================================================
# FMQL Ethernet controller
CONFIG_ETH_FMQL=y
CONFIG_MDIO=y

# Initialization priorities for this board
CONFIG_SERIAL_INIT_PRIORITY=50
CONFIG_ETH_INIT_PRIORITY=80

# ==============================================================================
# Memory Configuration (Board/Architecture-Specific)
# ==============================================================================
# Non-cacheable memory region for DMA
CONFIG_NOCACHE_MEMORY=y

# ==============================================================================
# Network Buffer Optimization (Board Memory-Specific)
# ==============================================================================
# High-throughput configuration optimized for RBS2530_EC memory layout
# These override the defaults in prj_emmc.conf
CONFIG_NET_PKT_RX_COUNT=512
CONFIG_NET_PKT_TX_COUNT=64
CONFIG_NET_BUF_RX_COUNT=800
CONFIG_NET_BUF_TX_COUNT=800

# ==============================================================================
# Network Address Configuration (Board/Test Environment-Specific)
# ==============================================================================
# Network addresses for this board/test setup
# For linux<->board connectivity, swap addresses if needed
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.2"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_NEED_IPV6=y
CONFIG_NET_CONFIG_MY_IPV6_ADDR="2001:db8::2"
CONFIG_NET_CONFIG_PEER_IPV6_ADDR="2001:db8::1"

# ==============================================================================
# Compiler Optimizations (Board/Debug-Specific)
# ==============================================================================
# Disabled for debugging on this board
# CONFIG_NO_OPTIMIZATIONS=y
# CONFIG_DEBUG_OPTIMIZATIONS=y
