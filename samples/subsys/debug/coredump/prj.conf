#
# Configuration for Coredump with eMMC backend and network transfer
# Board-specific configurations should be in boards/<board>.conf

# ==============================================================================
# Kernel Configuration
# ==============================================================================
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=262144

# Kernel features
CONFIG_POSIX_API=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_INIT_STACKS=y

# ==============================================================================
# Coredump Configuration
# ==============================================================================
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_LINKER_RAM=y
CONFIG_DEBUG_COREDUMP_THREADS_METADATA=y
CONFIG_DEBUG_COREDUMP_SHELL=y

# Coredump backend: eMMC storage
CONFIG_DEBUG_COREDUMP_BACKEND_EMMC=y
CONFIG_DEBUG_COREDUMP_EMMC_CHUNK_SIZE=512
CONFIG_DEBUG_COREDUMP_EMMC_DEVICE_NAME="MMC"

# Alternative memory dump modes (disabled)
# CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y
# CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_THREADS=y

# ==============================================================================
# Storage Configuration
# ==============================================================================
# eMMC/Disk support
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_MMC=y
CONFIG_MMC_STACK=y
CONFIG_MMC_VOLUME_NAME="MMC"

# Disk Tools - For coredump transfer and diagnostics
CONFIG_DISK_TOOLS=y
CONFIG_DISK_TOOLS_BUFFER_SIZE=16384
CONFIG_DISK_TOOLS_NETWORK=y
CONFIG_DISK_TOOLS_NET_PORT=9999
CONFIG_DISK_TOOLS_NET_STACK_SIZE=4096
CONFIG_DISK_TOOLS_NET_THREAD_PRIORITY=5
CONFIG_DISK_TOOLS_NET_TIMEOUT_MS=30000

# ==============================================================================
# Logging Configuration
# ==============================================================================
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_PRINTK=y

# Network logging
CONFIG_NET_LOG=y
CONFIG_NET_STATISTICS=y

# Network debug logging (commented out by default for performance)
# CONFIG_NET_SOCKETS_LOG_LEVEL_DBG=y
# CONFIG_NET_CONN_LOG_LEVEL_DBG=y
# CONFIG_NET_CONTEXT_LOG_LEVEL_DBG=y
# CONFIG_NET_TCP_LOG_LEVEL_DBG=y
# CONFIG_NET_IF_LOG_LEVEL_DBG=y
# CONFIG_NET_L2_ETHERNET_LOG_LEVEL_DBG=y
# CONFIG_ETHERNET_LOG_LEVEL_DBG=y
# CONFIG_NET_PKT_LOG_LEVEL_DBG=y
# CONFIG_NET_BUF_LOG=y
# CONFIG_NET_BUF_LOG_LEVEL_DBG=y

# ==============================================================================
# Shell Configuration
# ==============================================================================
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_NET_SHELL=y

# ==============================================================================
# Networking Configuration
# ==============================================================================
# Core networking
CONFIG_NETWORKING=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONNECTION_MANAGER=y

# Network buffers (basic configuration, can be overridden in board config)
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=80
CONFIG_NET_BUF_TX_COUNT=80
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_NET_CONTEXT_NET_PKT_POOL=y

# IP configuration
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=3
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=4
CONFIG_NET_IF_MAX_IPV4_COUNT=3
CONFIG_NET_IF_MAX_IPV6_COUNT=3
CONFIG_NET_MAX_CONTEXTS=10

# ==============================================================================
# Ethernet and Link Layer
# ==============================================================================
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_NET_ICMPV4_ACCEPT_BROADCAST=y

# ==============================================================================
# TCP/IP Stack Configuration
# ==============================================================================
# TCP optimization for large transfers
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=65535
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=65535
CONFIG_NET_TCP_WORKQ_STACK_SIZE=4096

# ==============================================================================
# Socket Service Configuration
# ==============================================================================
# Socket service handles poll events for disk_tools and zperf
CONFIG_NET_SOCKETS_SERVICE=y
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_NET_SOCKETS_SERVICE_THREAD_PRIO=40
CONFIG_NET_SOCKETS_POLL_MAX=128

# ==============================================================================
# Network Performance Tools
# ==============================================================================
# zperf - Network throughput testing
CONFIG_NET_ZPERF=y
CONFIG_NET_ZPERF_MAX_PACKET_SIZE=2048
CONFIG_ZPERF_WORK_Q_STACK_SIZE=4096
