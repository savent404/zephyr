description: FMQL GMAC Ethernet controller

compatible: "snps,fmsh-gmac"

include: [ethernet-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  local-mac-address:
    type: uint8-array
    required: true
    description: "MAC address"

  clock-frequency:
    type: int
    required: true

  phy-handle:
    type: phandle
    required: true

  mdio-addr:
    type: int
    required: true
    description: "PHY MDIO address"

  gmii2rgmii-addr1:
    type: int
    required: true
    description: "GMII2RGMII converter 1 MDIO address"

  gmii2rgmii-addr2:
    type: int
    required: true
    description: "GMII2RGMII converter 2 MDIO address"

  phy-mode:
    type: string
    required: true
    enum:
      - "fiber"
      - "utp"
      - "none"
    description: "PHY interface mode selection"

  phy-delay:
    type: int
    required: true
    description: "PHY delay configuration value (hex)"

  fixed-speed:
    type: int
    default: 2
    enum:
      - 0
      - 1
      - 2
    description: "Link speed selection: 0=10Mbps, 1=100Mbps, 2=1000Mbps"

  auto-negotiation:
    type: int
    default: 1
    enum:
      - 0
      - 1
    description: "Enable auto-negotiation, defaults to true if not specified"

  local-ip-address:
    type: string
    required: true
    description: "Static IP address"

  local-netmask:
    type: string
    required: true
    description: "Network mask"

  local-gateway:
    type: string
    required: true
    description: "Gateway address"

  partner-eth:
    type: phandle
    description: "Reference to partner ethernet node that shares MDIO with this interface"
