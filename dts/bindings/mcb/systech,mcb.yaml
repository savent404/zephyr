description: SYSTech MCB Driver node

compatible: "systech,mcb"

include: base.yaml

properties:
  poll:
    type: int
    description: |
      The duration in microseconds between each poll of the MCB device.
    default: 100
  pps:
    type: int
    description: |
      The number of packets per second that the MCB device can handle.
    default: 1000
  slow:
    type: int
    description: |
      If true(>0), the MCB device is in slow mode.
    default: 0
